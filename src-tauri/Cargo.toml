[package]
name = "autonomous-ai-engineering-app"
version = "0.1.0"
description = "Autonomous AI Engineering Lab - Desktop Application"
authors = ["Autonomous AI Engineering Lab"]
license = "All Rights Reserved"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "autonomous_ai_engineering_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
os_info = "3"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
dotenv = "0.15"
chrono = "0.4"
sha2 = "0.10"

# Virtualization and network dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
cgroups-rs = "0.3"
sysinfo = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
sysinfo = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = "0.30"
